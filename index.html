<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="KMGaWukN-3TRFkLrVpixx3d6YsbXBnj4dbdAFpXzA3I">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutul Patel | Portfolio</title>
    <meta name="description" content="Rutul Patel's one-page portfolio with experience, projects, skills, and contact links.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png?">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png?">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png?">
    <link rel="manifest" href="favicon/site.webmanifest">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-layer">
        <div class="grid-bg"></div>
        <div class="glow glow-blue"></div>
        <div class="glow glow-purple"></div>
        <div class="glow glow-green"></div>
        <div class="scanlines"></div>
    </div>

    <header class="header">
        <nav class="nav container">
            <a href="#home" class="brand" id="brand-name">rutulpatel</a>
            <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu" aria-expanded="false">
                <i data-lucide="menu"></i>
            </button>
            <ul class="nav-links" id="nav-links">
                <li><a href="#about">About</a></li>
                <li><a href="#experience">Experience</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main id="home">
        <section class="hero container">
            <p class="eyebrow" id="hero-eyebrow"></p>
            <h1 class="hero-title" id="hero-name"></h1>
            <p class="hero-role" id="hero-role"></p>
            <p class="hero-summary" id="hero-summary"></p>
            <div class="hero-actions">
                <a href="#projects" class="btn btn-primary">View Projects</a>
                <a href="#contact" class="btn btn-secondary">Contact Me</a>
            </div>
            <div class="hero-stats">
                <article>
                    <h3 id="years-experience">0+</h3>
                    <p>Years Building</p>
                </article>
                <article>
                    <h3 id="projects-count">0+</h3>
                    <p>Projects</p>
                </article>
                <article>
                    <h3 id="skills-count">0+</h3>
                    <p>Core Skills</p>
                </article>
            </div>
        </section>

        <section class="section container" id="about">
            <h2>About</h2>
            <p id="about-summary"></p>
        </section>

        <section class="section container" id="experience">
            <h2>Experience</h2>
            <div id="experience-list" class="card-grid"></div>
        </section>

        <section class="section container" id="projects">
            <h2>Projects</h2>
            <div id="projects-grid" class="card-grid"></div>
        </section>

        <section class="section container" id="skills">
            <h2>Skills</h2>
            <div id="skills-grid" class="card-grid"></div>
        </section>

        <section class="section container" id="contact">
            <h2>Contact</h2>
            <div class="contact-grid">
                <a id="email-link" class="contact-card" href="#">
                    <i data-lucide="mail"></i>
                    <span id="email-text"></span>
                </a>
                <a id="location-link" class="contact-card" href="#" target="_blank" rel="noopener noreferrer">
                    <i data-lucide="map-pin"></i>
                    <span id="location-text"></span>
                </a>
            </div>
            <div class="social-links" id="social-links"></div>
        </section>
    </main>

    <footer class="footer">
        <p>© <span id="footer-year"></span> <span id="footer-name"></span>. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
